# The ONLY thing you apply by hand. It makes ArgoCD manage everything under gitops/apps/local.
# EDIT repoURL. Apply with:  kubectl apply -f gitops/bootstrap/root-local.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<your-user>/careconnect-platform.git
    targetRevision: main
    path: gitops/apps/local
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

# Release = push a semantic version tag:   git tag v1.0.1 && git push origin v1.0.1
# Flow: test -> build multi-arch image -> push to Docker Hub -> commit the new tag into the LOCAL environment values.
# ArgoCD sees that commit and rolls the change out. CI never talks to the cluster.
name: release

on:
  push:
    tags: ["v*.*.*"]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/careconnect-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
        working-directory: apps/careconnect-service

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: apps/careconnect-service
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops-local:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point the local environment at the new image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for svc in patient appointment doctor; do
            F=gitops/envs/local/$svc.yaml
            yq -i ".image.repository = \"${{ env.IMAGE }}\"" $F
            yq -i ".image.tag = \"${VERSION}\"" $F
            yq -i ".image.pullPolicy = \"IfNotPresent\"" $F
          done
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/envs/local
          git commit -m "ci: deploy ${GITHUB_REF_NAME} to local" || echo "nothing to commit"
          git push origin main

# booking (Node.js) on EKS behind one shared ALB, routed by path. Replace <dockerhub-user>.
image:
  repository: <dockerhub-user>/careconnect-booking
  tag: "1.0.0"
  pullPolicy: IfNotPresent
env:
  SERVICE_NAME: booking
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  BACKEND_URL: http://appointments
ingress:
  enabled: true
  className: alb
  path: /booking
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/group.name: careconnect
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6

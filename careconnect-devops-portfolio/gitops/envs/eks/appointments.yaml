# appointments (Spring Boot) on EKS behind one shared ALB, routed by path. Replace <dockerhub-user>.
image:
  repository: <dockerhub-user>/careconnect-appointments
  tag: "1.0.0"
  pullPolicy: IfNotPresent
env:
  SERVICE_NAME: appointments
  AWS_REGION: us-east-1
  DYNAMODB_TABLE: careconnect-appointments
ingress:
  enabled: true
  className: alb
  path: /appointments
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/group.name: careconnect
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6

# Local datastores (Postgres, MariaDB, Redis) for the kind cluster, also deployed by ArgoCD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: careconnect-datastores
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<your-user>/careconnect-devops-portfolio.git
    targetRevision: main
    path: k8s/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: careconnect
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# Path-based routing with ingress-nginx: /portal -> portal, /doctors -> doctors.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: careconnect
  namespace: careconnect
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /portal(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: portal, port: { number: 80 } } }
          - path: /doctors(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: doctors, port: { number: 80 } } }

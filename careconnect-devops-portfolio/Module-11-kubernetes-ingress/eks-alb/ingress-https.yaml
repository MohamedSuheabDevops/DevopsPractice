# HTTPS needs a domain and an ACM certificate (see Module-16, optional). EDIT <CERT_ARN> and <DOMAIN>.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: careconnect-alb-https
  namespace: careconnect
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: <CERT_ARN>
spec:
  ingressClassName: alb
  rules:
    - host: portal.<DOMAIN>
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: portal, port: { number: 80 } } } }

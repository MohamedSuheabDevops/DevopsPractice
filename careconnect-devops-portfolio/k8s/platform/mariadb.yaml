# DEV ONLY. The password is a placeholder for local practice. On AWS use RDS + Secrets Manager.
apiVersion: v1
kind: Secret
metadata: { name: mariadb-secret, namespace: careconnect }
stringData:
  MARIADB_ROOT_PASSWORD: dev-only-change-me
  MARIADB_DATABASE: doctors
---
apiVersion: v1
kind: Service
metadata: { name: mariadb, namespace: careconnect }
spec:
  clusterIP: None
  selector: { app: mariadb }
  ports: [{ port: 3306 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mariadb, namespace: careconnect }
spec:
  serviceName: mariadb
  replicas: 1
  selector: { matchLabels: { app: mariadb } }
  template:
    metadata: { labels: { app: mariadb } }
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          envFrom: [{ secretRef: { name: mariadb-secret } }]
          ports: [{ containerPort: 3306 }]
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
          readinessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            periodSeconds: 10
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 500Mi } }

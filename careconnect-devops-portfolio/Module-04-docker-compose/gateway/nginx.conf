# Docker's built-in DNS, re-checked every 5 seconds so scaled replicas are picked up.
resolver 127.0.0.11 valid=5s;

server {
    listen 80;

    location /portal/ {
        set $upstream http://portal:8080;
        rewrite ^/portal/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /appointments/ {
        set $upstream http://appointments:8080;
        rewrite ^/appointments/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /doctors/ {
        set $upstream http://doctors:8080;
        rewrite ^/doctors/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /billing/ {
        set $upstream http://billing:8080;
        rewrite ^/billing/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /booking/ {
        set $upstream http://booking:8080;
        rewrite ^/booking/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location / { return 200 "CareConnect gateway is up\n"; }
}

# Release by pushing a version tag:   git tag v1.0.1 && git push origin v1.0.1
# Flow: build 5 images -> push to Docker Hub -> commit the new tag into gitops/envs/dev -> ArgoCD deploys.
# CI never talks to the cluster. The commit in Git is the deployment.
# Needs repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
name: release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [portal, appointments, billing, doctors, booking]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/careconnect-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          platforms: linux/amd64        # add linux/arm64 for multi-arch (slower, see Module-05)
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-gitops:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point the dev environment at the new images
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for svc in portal appointments billing doctors booking; do
            F=gitops/envs/dev/$svc.yaml
            yq -i ".image.repository = \"${{ secrets.DOCKERHUB_USERNAME }}/careconnect-$svc\"" $F
            yq -i ".image.tag = \"${VERSION}\"" $F
          done
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/envs/dev
          git commit -m "ci: deploy ${GITHUB_REF_NAME} to dev" || echo "nothing to commit"
          git push origin main

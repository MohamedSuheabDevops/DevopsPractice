# Runs on every pull request. Free, needs no secrets. Nothing is deployed.
name: pr-checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [portal, appointments, billing, doctors, booking]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          push: false
          tags: careconnect-${{ matrix.service }}:pr
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render the chart for every service and environment
        run: |
          for env in dev eks; do
            for svc in portal appointments billing doctors booking; do
              helm lint charts/careconnect-service -f gitops/envs/$env/$svc.yaml
              helm template $svc charts/careconnect-service -f gitops/envs/$env/$svc.yaml > /dev/null
            done
          done

# EDIT: role -> terraform output node_role_name
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: careconnect-eks-karpenter-node
  amiSelectorTerms:
    - alias: al2023@latest          # production: pin a version (al2023@v2025MMDD) and roll it deliberately
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: careconnect-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: careconnect-eks
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: on-demand
spec:
  weight: 10                                      # lower priority than spot when a pod accepts both
  template:
    metadata:
      labels: { capacity: on-demand }
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: default }
      requirements:
        - { key: karpenter.sh/capacity-type, operator: In, values: ["on-demand"] }
        - { key: kubernetes.io/arch, operator: In, values: ["amd64"] }
        - { key: karpenter.k8s.aws/instance-category, operator: In, values: ["c", "m", "t"] }
        - { key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["4"] }
        - { key: karpenter.k8s.aws/instance-size, operator: NotIn, values: ["nano", "micro", "metal"] }
      expireAfter: 720h
  limits:
    cpu: "8"                                      # PRACTICE SAFETY CAP: never more than 8 vCPUs from this pool
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m

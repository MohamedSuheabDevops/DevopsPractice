# Classic HPA demo app: burns CPU on every request.
apiVersion: apps/v1
kind: Deployment
metadata: { name: php-apache, namespace: careconnect }
spec:
  replicas: 1
  selector: { matchLabels: { app: php-apache } }
  template:
    metadata: { labels: { app: php-apache } }
    spec:
      containers:
        - name: php-apache
          image: registry.k8s.io/hpa-example
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 200m, memory: 64Mi }     # HPA % is relative to the REQUEST
            limits:   { cpu: 500m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: php-apache, namespace: careconnect }
spec:
  selector: { app: php-apache }
  ports: [{ port: 80 }]

# Configuration kept outside the image, injected as environment variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: doctors-config
  namespace: careconnect
data:
  SERVICE_NAME: doctors
  DB_HOST: mariadb
  DB_PORT: "3306"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctors
  namespace: careconnect
spec:
  replicas: 2
  selector:
    matchLabels: { app: doctors }
  template:
    metadata:
      labels: { app: doctors, tier: backend }
    spec:
      containers:
        - name: doctors
          image: careconnect-doctors:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: doctors-config }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5

apiVersion: v1
kind: Pod
metadata:
  name: billing-secret-demo
  namespace: careconnect
spec:
  containers:
    - name: billing
      image: careconnect-billing:dev
      imagePullPolicy: IfNotPresent
      env:
        - name: DB_PASSWORD               # one key as an environment variable
          valueFrom:
            secretKeyRef:
              name: billing-db-credentials
              key: DB_PASSWORD
      volumeMounts:
        - name: creds
          mountPath: /etc/secrets         # every key as a file
          readOnly: true
  volumes:
    - name: creds
      secret:
        secretName: billing-db-credentials

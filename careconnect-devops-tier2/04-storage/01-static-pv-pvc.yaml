# STATIC provisioning: an admin creates the PV, a developer claims it with a PVC.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: manual-pv
spec:
  capacity:
    storage: 200Mi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain      # keep data after the PVC is deleted
  storageClassName: manual
  hostPath:
    path: /mnt/manual-pv                      # path on the kind node (never use hostPath in production)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manual-pvc
  namespace: careconnect
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: manual
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: writer-static
  namespace: careconnect
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'hello from static pv' >> /data/log.txt; sleep 3600"]
      volumeMounts:
        - { name: data, mountPath: /data }
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: manual-pvc

# For ALB with target-type "ip" the Service can be plain ClusterIP: the ALB sends traffic straight to pod IPs.
# Set image to YOUR pushed image, e.g. <dockerhub-user>/careconnect-demo:1.0.0
apiVersion: apps/v1
kind: Deployment
metadata: { name: appointment-service, namespace: careconnect }
spec:
  replicas: 3
  selector: { matchLabels: { app: appointment-service } }
  template:
    metadata: { labels: { app: appointment-service } }
    spec:
      containers:
        - name: app
          image: <dockerhub-user>/careconnect-demo:1.0.0
          env: [{ name: SERVICE_NAME, value: appointment-service }]
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
          readinessProbe: { httpGet: { path: /health, port: 8000 } }
---
apiVersion: v1
kind: Service
metadata: { name: appointment-service, namespace: careconnect }
spec:
  type: ClusterIP
  selector: { app: appointment-service }
  ports: [{ port: 80, targetPort: 8000 }]

# Two backend services (same image, different SERVICE_NAME)
apiVersion: apps/v1
kind: Deployment
metadata: { name: patient-service, namespace: careconnect }
spec:
  replicas: 2
  selector: { matchLabels: { app: patient-service } }
  template:
    metadata: { labels: { app: patient-service } }
    spec:
      containers:
        - name: app
          image: careconnect-service:1.0.0
          imagePullPolicy: IfNotPresent
          env: [{ name: SERVICE_NAME, value: patient-service }]
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: 8000 } }
---
apiVersion: v1
kind: Service
metadata: { name: patient-service, namespace: careconnect }
spec:
  selector: { app: patient-service }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: appointment-service, namespace: careconnect }
spec:
  replicas: 2
  selector: { matchLabels: { app: appointment-service } }
  template:
    metadata: { labels: { app: appointment-service } }
    spec:
      containers:
        - name: app
          image: careconnect-service:1.0.0
          imagePullPolicy: IfNotPresent
          env: [{ name: SERVICE_NAME, value: appointment-service }]
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: 8000 } }
---
apiVersion: v1
kind: Service
metadata: { name: appointment-service, namespace: careconnect }
spec:
  selector: { app: appointment-service }
  ports: [{ port: 80, targetPort: 8000 }]

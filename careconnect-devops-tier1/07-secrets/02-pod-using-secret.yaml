apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  namespace: careconnect
spec:
  containers:
    - name: app
      image: careconnect-service:1.0.0
      imagePullPolicy: IfNotPresent
      env:
        - name: DB_PASSWORD            # one key as an env var
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD
      envFrom:
        - secretRef:
            name: db-credentials       # or every key as env vars
      volumeMounts:
        - name: creds
          mountPath: /etc/secrets      # each key becomes a file
          readOnly: true
  volumes:
    - name: creds
      secret:
        secretName: db-credentials
        defaultMode: 0400

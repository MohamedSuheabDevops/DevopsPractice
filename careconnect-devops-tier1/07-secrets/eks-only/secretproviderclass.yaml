# EKS ONLY (read and understand; needs a real cluster + AWS account).
# Secrets Store CSI Driver + AWS Secrets and Configuration Provider (ASCP).
# The pod mounts the secret straight from AWS Secrets Manager. No secret value in Git or etcd (unless you sync it).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: catalog-db-secret
  namespace: careconnect
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "careconnect/catalog/db"      # name in AWS Secrets Manager
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: db-username
          - path: password
            objectAlias: db-password
  secretObjects:                                   # optional: ALSO create a K8s Secret
    - secretName: catalog-db
      type: Opaque
      data:
        - objectName: db-username
          key: DB_USER
        - objectName: db-password
          key: DB_PASSWORD

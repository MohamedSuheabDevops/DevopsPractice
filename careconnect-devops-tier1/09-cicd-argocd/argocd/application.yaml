# Apply AFTER ArgoCD is installed. Replace <your-user>/<repo>.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: appointment-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<your-user>/<repo>.git
    targetRevision: main
    path: 08-helm/careconnect-service         # the Helm chart folder
    helm:
      valueFiles:
        - services/appointment.yaml          # CI rewrites image.tag here
        - values-dev.yaml
      releaseName: appointment
  destination:
    server: https://kubernetes.default.svc   # the cluster ArgoCD runs in
    namespace: careconnect-gitops
  syncPolicy:
    automated:
      prune: true          # delete resources removed from Git
      selfHeal: true       # revert manual changes made with kubectl
    syncOptions:
      - CreateNamespace=true

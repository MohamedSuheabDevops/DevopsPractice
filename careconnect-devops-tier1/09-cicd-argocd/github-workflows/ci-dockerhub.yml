# FREE VERSION (practise this first). Copy to .github/workflows/ci.yml in YOUR repo.
# Needs repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# Release: git tag v1.0.1 && git push origin v1.0.1
name: ci

on:
  push:
    tags: ["v*.*.*"]          # semantic version tags trigger a release build
  pull_request:
    branches: [main]          # PRs only build (no push) to catch errors early

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/careconnect-appointment

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags from git tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: apps/python-service
          file: 02-dockerfile-mastery/Dockerfile.good
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    # GitOps step: CI never touches the cluster. It only commits the new tag to Git.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # tag checkouts are detached; we need a branch to push to

      - name: Bump image tag in Helm values
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          yq -i ".image.repository = \"${{ secrets.DOCKERHUB_USERNAME }}/careconnect-appointment\"" 08-helm/careconnect-service/services/appointment.yaml
          yq -i ".image.tag = \"${VERSION}\"" 08-helm/careconnect-service/services/appointment.yaml

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 08-helm
          git commit -m "ci: appointment-service -> ${GITHUB_REF_NAME}" || echo "nothing to commit"
          git push origin main

# COURSE VERSION: GitHub Actions -> AWS ECR using OIDC (no access keys stored anywhere).
# Needs: the IAM role from ../aws-oidc/, repo secret AWS_ROLE_ARN, an ECR repo named careconnect/appointment-service
name: ci-ecr

on:
  push:
    tags: ["v*.*.*"]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: careconnect/appointment-service

permissions:
  id-token: write      # REQUIRED: lets the job request an OIDC token from GitHub
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/python-service
          file: 02-dockerfile-mastery/Dockerfile.good
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-helm-values:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update image in Helm values
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          F=08-helm/careconnect-service/services/appointment.yaml
          yq -i ".image.repository = \"${{ needs.build-push.outputs.registry }}/${{ env.ECR_REPOSITORY }}\"" $F
          yq -i ".image.tag = \"${VERSION}\"" $F
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 08-helm
          git commit -m "ci: appointment-service -> ${GITHUB_REF_NAME}" || echo "nothing to commit"
          git push origin main

# STEP 2 - Named volumes, custom networks, health checks
services:
  patient-service:
    build: ../../services/app
    environment:
      SERVICE_NAME: patient-service
    networks: [frontend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  appointment-service:
    build: ../../services/app
    environment:
      SERVICE_NAME: appointment-service
      DEPENDENCIES: "postgres:5432,redis:6379"
    networks: [frontend, backend]      # can talk to gateway AND databases
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careconnect
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: careconnect
    volumes:
      - pgdata:/var/lib/postgresql/data   # named volume: data survives `down`
    networks: [backend]                   # NOT on frontend -> gateway can't reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careconnect -d careconnect"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ../../gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend]

networks:
  frontend:
  backend:

volumes:
  pgdata:

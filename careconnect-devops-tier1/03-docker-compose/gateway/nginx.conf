# Docker's embedded DNS. Re-resolves names every 5s so scaled replicas get picked up.
resolver 127.0.0.11 valid=5s;

server {
    listen 80;

    location /patients/ {
        set $upstream http://patient-service:8000;
        rewrite ^/patients/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /appointments/ {
        set $upstream http://appointment-service:8000;
        rewrite ^/appointments/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /doctors/ {
        set $upstream http://doctor-service:8000;
        rewrite ^/doctors/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location / { return 200 "CareConnect gateway is up\n"; }
}

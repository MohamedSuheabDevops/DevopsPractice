# FINAL REFERENCE - everything from Module-04 in one file (CareConnect)
# Run:  docker compose up -d --build
# Try:  docker compose --profile tools up -d
services:
  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend]
    depends_on:
      patient-service:     { condition: service_healthy }
      appointment-service: { condition: service_healthy }
      doctor-service:      { condition: service_healthy }

  patient-service:
    build: ./services/app
    environment:
      SERVICE_NAME: patient-service
    networks: [frontend]
    healthcheck: &svc-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  appointment-service:
    build: ./services/app
    environment:
      SERVICE_NAME: appointment-service
      DEPENDENCIES: "db:5432,redis:6379"
    networks: [frontend, backend]
    healthcheck: *svc-health
    depends_on:
      postgres:   { condition: service_healthy }
      redis:      { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
    deploy:
      replicas: ${APPOINTMENT_REPLICAS:-2}
      resources:
        limits: { cpus: "0.25", memory: 64M }

  doctor-service:
    build: ./services/app
    environment:
      SERVICE_NAME: doctor-service
      DEPENDENCIES: "mariadb:3306"
    networks: [frontend, backend]
    healthcheck: *svc-health
    depends_on:
      mariadb: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks:
      backend:
        aliases: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: doctors
    volumes: [mariadbdata:/var/lib/mysql]
    networks: [backend]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-migrate:
    image: postgres:16-alpine
    entrypoint: ["psql"]
    command:
      - "-h"
      - "db"
      - "-U"
      - "${POSTGRES_USER}"
      - "-d"
      - "${POSTGRES_DB}"
      - "-c"
      - "CREATE TABLE IF NOT EXISTS appointments (id serial PRIMARY KEY, patient text, slot timestamp);"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # ---- profiles ----
  adminer:
    image: adminer:4
    profiles: ["tools"]
    ports: ["8081:8080"]
    networks: [backend]

  debug:
    image: busybox:1.36
    profiles: ["debug"]
    command: ["sleep", "3600"]
    networks: [frontend, backend]

networks:
  frontend:
  backend:

volumes:
  pgdata:
  mariadbdata:

# DEBUG EXERCISE: pods start but never become Ready, because /health returns 503
# (the app can't reach "nothing:9999"). Find out why, then fix it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-service
  namespace: careconnect
spec:
  replicas: 2
  selector:
    matchLabels: { app: broken-service }
  template:
    metadata:
      labels: { app: broken-service }
    spec:
      containers:
        - name: app
          image: careconnect-service:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DEPENDENCIES
              value: "nothing:9999"
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
